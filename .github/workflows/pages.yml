# Publishes the trilingual guide (print/docs/guide.html) as a GitHub Pages site.
# The page is served at the site root (index.html) and at /guide.html.
# Requires, once: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
    paths:
      - 'print/docs/guide.html'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          mkdir -p _site
          cp print/docs/guide.html _site/index.html
          cp print/docs/guide.html _site/guide.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
