# Publishes the trilingual guide (print/docs/guide.html) as a GitHub Pages site.
# The page is served at the site root (index.html) and at /guide.html.
# Requires, once: repo Settings -> Pages -> Build and deployment -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare site
        run: |
          # Publish the whole repository so existing paths keep working
          # (e.g. /print/simulateur/ and /print/docs/), then make the site root the guide.
          mkdir -p _site
          tar --exclude='./.git' --exclude='./_site' -cf - . | tar -xf - -C _site
          cp print/docs/guide.html _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
